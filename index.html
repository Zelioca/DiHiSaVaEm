<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>biblioteca</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!--HEADER-->
    <header class="header-page">
      <a href="index.html">
        <h1>Biblioteca</h1>
      </a>

      <input type="text" id="pesquisar" placeholder="Pesquisar" />
      <a href="#"> Login </a>
      <a href="livros.html"> Cadastrar livros </a>
      <a href="alunos.html"> Cadastrar alunos </a>
    </header>
    <!--main-->
    <main class="page">
      <!--article-->
      <article class="article">
        <h1>Livros</h1>
        <section class="search">
          <input type="text" id="searchBook" placeholder="Buscar livro" />
          <button id="buttonSearchBook">🔎</button>
        </section>
        <section class="searchResult"></section>
      </article>
      <!--aside-->
      <aside class="aside">
        <h1>Aluno</h1>
        <section class="search">
          <input
            type="text"
            id="searchAluno"
            placeholder="Buscar Aluno cadastrado"
          />
          <button id="buttonSearchAluno">🔎</button>
        </section>
        <section class="searchResult"></section>
      </aside>
    </main>
    <footer class="footer-page">
      <p>Made by os Desempregados</p>
    </footer>
  </body>
</html>
