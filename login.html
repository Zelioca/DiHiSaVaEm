<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo - DiHiSaVaEn</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --header-bg: rgba(15, 23, 42, 0.85);
      --card-bg: linear-gradient(180deg, rgba(67, 56, 202, 0.25) 0%, rgba(30, 27, 75, 0.5) 100%);
      --card-border: rgba(99, 102, 241, 0.3);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.15);
      --glass-blur: blur(12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    header {
      background: var(--header-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-link {
      text-decoration: none;
      color: inherit;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      transition: opacity 0.2s ease;
    }

    .brand:hover {
      opacity: 0.9;
    }

    .brand svg {
      width: 28px;
      height: 28px;
      fill: var(--accent);
    }

    .version-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Conteúdo Principal Centralizado para o Login */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-icon {
      width: 60px;
      height: 60px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .login-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    input[type="email"],
    input[type="password"] {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .login-actions {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      width: 100%;
      text-decoration: none;
      display: inline-block;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-back-home {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .btn-back-home:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <a href="index.html" class="brand-link" title="Ir para a página inicial">
      <div class="brand">
        <svg viewBox="0 0 24 24">
          <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
        </svg>
        <span>DiHiSaVaEn</span>
      </div>
    </a>

    <div class="version-badge">
      Sistema Admin v1.0
    </div>

    <div>
      <!-- Espaço vazio ou indicador na direita -->
    </div>
  </header>

  <!-- Conteúdo Principal: Caixa de Login Centralizada -->
  <main>
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>

      <h1 class="login-title">Painel de Acesso</h1>
      <p class="login-subtitle">Entre com suas credenciais de administração</p>

      <!-- O formulário redireciona para a index.html ao clicar em entrar -->
      <form action="index.html" method="GET">
        
        <div class="form-group">
          <label for="email">E-mail Administrativo</label>
          <input type="email" id="email" name="email" placeholder="admin@dihisavaen.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha de Acesso</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="login-actions">
          <button type="submit" class="btn-submit">Entrar no Sistema</button>
          <a href="index.html" class="btn-back-home">Voltar para a página inicial</a>
        </div>

      </form>
    </div>
  </main>

</body>
</html>
