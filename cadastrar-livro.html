<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Livro - DiHiSaVaEn</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --header-bg: rgba(15, 23, 42, 0.85);
      --card-bg: linear-gradient(180deg, rgba(67, 56, 202, 0.25) 0%, rgba(30, 27, 75, 0.5) 100%);
      --card-border: rgba(99, 102, 241, 0.3);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success-green: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.15);
      --glass-blur: blur(12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    header {
      background: var(--header-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-link {
      text-decoration: none;
      color: inherit;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      transition: opacity 0.2s ease;
    }

    .brand:hover {
      opacity: 0.9;
    }

    .brand svg {
      width: 28px;
      height: 28px;
      fill: var(--accent);
    }

    .version-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-login {
      background: var(--accent);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: var(--accent-hover);
    }

    /* POPUP / ALERT DE SUCESSO VERDE */
    .alert-success {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--success-bg);
      border: 1px solid var(--success-green);
      color: #4ade80;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
      animation: fadeIn 0.3s ease;
    }

    /* Exibe o alerta verde quando acionado por #sucesso */
    .alert-success:target {
      display: flex;
    }

    .alert-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
    }

    .alert-content svg {
      width: 22px;
      height: 22px;
      stroke: var(--success-green);
      flex-shrink: 0;
    }

    .btn-close-alert {
      color: #4ade80;
      text-decoration: none;
      font-size: 1.25rem;
      line-height: 1;
      opacity: 0.8;
    }

    .btn-close-alert:hover {
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Conteúdo Principal */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .page-navigation {
      margin-bottom: 1.5rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .btn-back:hover {
      color: #fff;
    }

    .btn-back svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .form-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1rem;
    }

    .form-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }

    .form-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .section-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    select option {
      background: #1e1b4b;
      color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .btn-save {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    @media (max-width: 640px) {
      main {
        padding: 1.5rem 1rem;
      }

      .form-card {
        padding: 1.5rem;
      }

      .form-actions {
        flex-direction: column-reverse;
      }

      .btn-cancel,
      .btn-save {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- Cabeçalho -->
  <header>
    <a href="index.html" class="brand-link" title="Ir para a página inicial">
      <div class="brand">
        <svg viewBox="0 0 24 24">
          <path
            d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z" />
        </svg>
        <span>DiHiSaVaEn</span>
      </div>
    </a>

    <div class="version-badge">
      Sistema Admin v1.0
    </div>

    <div>
      <a href="login.html" class="btn-login">Login Admin</a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <div class="page-navigation">
      <a href="index.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Voltar para a página inicial
      </a>
    </div>

    <!-- POPUP/ALERT DE SUCESSO (Aparece ao ir para #sucesso) -->
    <div id="sucesso" class="alert-success">
      <div class="alert-content">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Livro cadastrado com sucesso no sistema!</span>
      </div>
      <a href="#" class="btn-close-alert" title="Fechar aviso">&times;</a>
    </div>

    <div class="form-card">
      <div class="form-header">
        <h1 class="form-title">Cadastrar Novo Livro</h1>
        <p class="form-subtitle">Preencha as informações do acervo para registro no banco de dados.</p>
      </div>

      <!-- Redireciona para #sucesso para simular o cadastro concluído -->
      <form action="#sucesso" method="GET">

        <!-- Bloco 1: Informações Principais -->
        <div class="form-section">
          <div class="section-label">📌 Informações Principais</div>
          <div class="form-grid">

            <div class="form-group full-width">
              <label for="titulo">Título do Livro *</label>
              <input type="text" id="titulo" name="titulo" placeholder="Ex: Dom Casmurro" required>
            </div>

            <div class="form-group">
              <label for="autor">Autor *</label>
              <input type="text" id="autor" name="autor" placeholder="Ex: Machado de Assis" required>
            </div>

            <div class="form-group">
              <label for="genero">Gênero / Categoria *</label>
              <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecione um gênero</option>
                <option value="romance">Romance</option>
                <option value="ficcao">Ficção Científica</option>
                <option value="fantasia">Fantasia</option>
                <option value="historia">História</option>
                <option value="didatico">Didático / Técnico</option>
                <option value="outros">Outros</option>
              </select>
            </div>

          </div>
        </div>

        <!-- Bloco 2: Detalhes Técnicos -->
        <div class="form-section">
          <div class="section-label">📋 Detalhes Técnicos</div>
          <div class="form-grid">

            <div class="form-group">
              <label for="isbn">Código ISBN / Identificador</label>
              <input type="text" id="isbn" name="isbn" placeholder="Ex: 978-85-359-0277-7">
            </div>

            <div class="form-group">
              <label for="editora">Editora</label>
              <input type="text" id="editora" name="editora" placeholder="Ex: Companhia das Letras">
            </div>

            <div class="form-group">
              <label for="ano">Ano de Publicação</label>
              <input type="number" id="ano" name="ano" placeholder="Ex: 1899" min="1000" max="2099">
            </div>

            <div class="form-group">
              <label for="exemplares">Quantidade de Exemplares *</label>
              <input type="number" id="exemplares" name="exemplares" placeholder="Ex: 1" min="1" value="1" required>
            </div>

            <div class="form-group full-width">
              <label for="observacoes">Observações ou Sinopse</label>
              <textarea id="observacoes" name="observacoes"
                placeholder="Adicione notas sobre o estado do livro, edição ou breve resumo..."></textarea>
            </div>

          </div>
        </div>

        <!-- Ações do Formulário -->
        <div class="form-actions">
          <a href="index.html" class="btn-cancel">Cancelar</a>
          <button type="submit" class="btn-save">Salvar e Cadastrar Livro</button>
        </div>

      </form>
    </div>
  </main>
  <script src="js/db.js"></script>
  <script src="js/livros.js"></script>
</body>

</html>
